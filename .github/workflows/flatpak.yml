name: Flatpak Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  flatpak:
    name: Build Flatpak Bundle (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak & KDE 6.10 Runtime/SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.10 org.kde.Sdk//6.10

      - name: Build Flatpak & Export Bundle
        run: |
          flatpak-builder --user --repo=flatpak-repo --force-clean build-flatpak com.kumar.finly.json
          flatpak build-bundle flatpak-repo finly-kde.flatpak com.kumar.finly

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finly-flatpak-x86_64
          path: finly-kde.flatpak

  release:
    name: Attach Flatpak to Release
    needs: [flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Flatpak Bundle
        uses: actions/download-artifact@v4
        with:
          name: finly-flatpak-x86_64
          path: release-assets

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.flatpak
          generate_release_notes: true
