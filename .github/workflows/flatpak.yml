name: Build Flatpak

on:
  push:
    tags:
      - "v*"

jobs:
  flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=flatpak-repo build-flatpak com.kumar.finly.json
          flatpak build-bundle flatpak-repo finly-kde.flatpak com.kumar.finly

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: finly-kde-flatpak
          path: finly-kde.flatpak

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: finly-kde.flatpak
          generate_release_notes: true
